<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f1ea"><title>대화틈 · 구독 관리</title>
<script>(function(){var ua=navigator.userAgent||'';if(/DaehwateumAndroid/.test(ua))document.documentElement.classList.add('native-app');if(/DaehwateumInsets\/2/.test(ua))document.documentElement.classList.add('native-insets-v2')})();</script>
<style>:root{--b:#f6f1ea;--p:#fffdfa;--i:#292521;--m:#7b746c;--l:#e5ddd3;--g:#405b52;--soft:#eee8df;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}html{background:var(--b)}body{margin:0;background:var(--b);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}.native-app{--safe-top:max(env(safe-area-inset-top,0px),30px);--safe-bottom:max(env(safe-area-inset-bottom,0px),10px)}.native-app.native-insets-v2{--safe-top:0px;--safe-bottom:0px}.page{width:min(94%,760px);margin:auto;padding-bottom:54px}.top{height:68px;display:flex;align-items:center;gap:10px}.top a{width:40px;height:40px;display:grid;place-items:center;color:var(--i);text-decoration:none;font-size:22px}.card{background:var(--p);border:1px solid var(--l);border-radius:26px;padding:24px;box-shadow:0 20px 60px #4a3b2e10}.card+.card{margin-top:14px}.k{font-size:9px;letter-spacing:.14em;font-weight:900;color:var(--m)}h1{font-family:Georgia,"Noto Serif KR",serif;font-weight:500;letter-spacing:-.045em;font-size:34px;line-height:1.15;margin:8px 0 12px}h2{font-size:18px;margin:0 0 8px}.lead,.body{color:var(--m);font-size:14px;line-height:1.7}.plan{margin-top:22px;padding-top:20px;border-top:1px solid var(--l);display:flex;justify-content:space-between;gap:16px;align-items:flex-end}.plan small{color:var(--m);font-size:12px;font-weight:800}.plan b{display:block;font-size:25px;margin-top:4px}.period{color:var(--m);font-size:12px;text-align:right}.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;margin-top:18px;border:0;border-radius:999px;background:var(--g);color:#fff;text-decoration:none;font-weight:900}.btn.secondary{background:transparent;color:var(--i);border:1px solid var(--l)}ul{margin:12px 0 0;padding-left:20px}li{font-size:14px;line-height:1.65}li+li{margin-top:8px}.hidden{display:none!important}#premiumEndCard{display:none}@media(max-width:600px){.card{padding:22px 18px;border-radius:22px}.plan{align-items:flex-start;flex-direction:column}.period{text-align:left}}</style>
</head>
<body>
<main class="page">
<header class="top"><a href="../../" aria-label="뒤로">←</a><b>구독 관리</b></header>
<section class="card"><span class="k">SUBSCRIPTION</span><h1>구독 관리</h1><p class="lead">현재 플랜과 Premium 이용 상태를 확인할 수 있어요.</p><div class="plan"><div><small>현재 플랜</small><b id="planName">확인 중…</b><div class="body" id="planNote"></div></div><div class="period" id="period"></div></div></section>
<section class="card"><h2 id="actionTitle">구독 상태를 확인하고 있어요</h2><p class="body" id="actionBody"></p><div id="action"></div></section>
<section class="card" id="premiumEndCard"><h2>Premium이 끝나면</h2><ul><li>이용 기간이 남아 있다면 종료일까지 Premium 기능은 유지돼요.</li><li>그 뒤 내가 방장인 7일 초과 대화틈에서는 새 질문만 멈춰요.</li><li>지난 질문, 답변, 회고와 히스토리는 그대로 남아요.</li><li>계속 이어가고 싶다면 방장 넘기기를 요청할 수 있고 상대방이 수락해야 방장이 바뀌어요.</li></ul></section>
</main>
<iframe id="premiumSync" class="hidden" src="../?status-sync=1" title="" aria-hidden="true"></iframe>
<script>(function(){'use strict';
var SUB='dt.subscription.v1',PREM='dt.premium.beta.v1';
function get(k){try{return localStorage.getItem(k)||''}catch(e){return''}}
function json(k){try{return JSON.parse(get(k)||'null')}catch(e){return null}}
function date(v){if(!v)return'';var d=new Date(v);if(!isFinite(d.getTime()))return String(v);return new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric'}).format(d)}
var name=document.getElementById('planName'),note=document.getElementById('planNote'),period=document.getElementById('period'),title=document.getElementById('actionTitle'),body=document.getElementById('actionBody'),action=document.getElementById('action'),endCard=document.getElementById('premiumEndCard'),frame=document.getElementById('premiumSync');
function play(label){return '<a class="btn" href="https://play.google.com/store/account/subscriptions">'+label+'</a>'}
function premium(){return '<a class="btn" href="../../?premium=1">Premium 보기</a>'}
function betaManage(){return '<a class="btn secondary" href="../">Beta Premium 관리</a>'}
function reset(){action.innerHTML='';period.textContent='';endCard.style.display='none'}
function render(){var s=json(SUB),status=s&&String(s.status||'').toLowerCase(),beta=get(PREM)==='1';reset();
if(status==='active'){name.textContent='Premium';note.textContent='구독 중';title.textContent='Premium 이용 중';body.textContent='Google Play에서 구독을 변경하거나 취소할 수 있어요.';if(s.current_period_end||s.expires_at)period.textContent=date(s.current_period_end||s.expires_at)+'까지 이용 가능';action.innerHTML=play('Google Play에서 구독 관리');endCard.style.display='block';return}
if(status==='canceled'||status==='cancelled'){name.textContent='Premium';note.textContent='구독 취소됨';title.textContent='구독은 취소됐어요';body.textContent='현재 이용 기간이 끝날 때까지 Premium을 그대로 사용할 수 있어요.';if(s.current_period_end||s.expires_at)period.textContent=date(s.current_period_end||s.expires_at)+'까지 이용 가능';action.innerHTML=play('구독 다시 시작하기');endCard.style.display='block';return}
if(beta){name.textContent='Premium';note.textContent='Private Beta';title.textContent='Beta Premium 이용 중';body.textContent='현재 Private Beta에서는 실제 결제가 연결되어 있지 않아요. 이 상태는 내 Premium 이용 권한만 기준으로 표시돼요.';action.innerHTML=betaManage();endCard.style.display='block';return}
name.textContent='Free';note.textContent='';title.textContent='Premium을 시작할까요?';body.textContent='7일 이후에도 같은 대화틈을 이어가고, 질문 예약과 더 빠른 다음 질문을 사용할 수 있어요.';action.innerHTML=premium()}
function syncDone(){setTimeout(render,250);setTimeout(render,900)}
window.addEventListener('storage',function(e){if(e.key===PREM||e.key===SUB)render()});
if(frame)frame.addEventListener('load',syncDone);setTimeout(render,1600);
})();</script>
</body></html>
