function read(){try{let x=JSON.parse(localStorage.getItem(SK));return x?.room&&x?.token?{...x,revealed:x.revealed||[]}:null}catch{return null}}function save(x){S=x;x?localStorage.setItem(SK,JSON.stringify(x)):localStorage.removeItem(SK)}function base(){let p=location.pathname;return p.endsWith('/')?p:p.slice(0,p.lastIndexOf('/')+1)}function invite(){return location.origin+base()+'?invite='+encodeURIComponent(S?.invite||'')}function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}async function rpc(n,p){let r=await fetch(U+'/rest/v1/rpc/'+n,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(p)}),t=await r.text(),d=t?JSON.parse(t):null;if(!r.ok)throw Error(d?.message||'문제가 생겼어요.');return d}function stop(){clearInterval(timer);timer=null}function poll(){stop();timer=setInterval(()=>{if(!document.hidden&&S&&!busy)load(true)},3500)}function top(mid=''){return `<div class="wrap"><header class="top"><button class="brand" onclick="home()"><span class="mark"><i></i><i></i></span>대화틈</button>${mid}${S?'<button class="dots" onclick="settings()">•••</button>':''}</header>`}function close(){return'</div>'}
function home(clean=false){stop();if(clean){I=null;history.replaceState({},'',base())}if(I&&S?.invite===I)return ownInvite();if(I)return join();let resume=S?`<section class="resume"><div><span class="kicker">이어지는 대화가 있어요</span><h3>${E(S.name)}님의 대화틈</h3><p>새 방을 만들지 않고 마지막 대화부터 이어가요.</p></div><button class="primary" onclick="load()">이어서 대화하기 →</button></section><p class="center"><button class="textbtn" onclick="newRoom()">새로운 대화틈 시작하기</button></p>`:'';app.innerHTML=top()+`<section class="hero"><div><span class="kicker">A SMALL SPACE BETWEEN US</span><h1>말 사이에,<br><em>대화할 틈.</em></h1><p>같은 질문에 각자 답하고,<br>둘 다 준비됐을 때 함께 열어봐요.</p>${S?'':'<button class="primary" onclick="create()">대화틈 만들기 →</button>'}<p style="font-size:11px">계정 없이 · 링크를 받은 두 사람만</p></div></section>${resume}`+close()}
function create(){stop();app.innerHTML=top()+`<section class="card intro center"><span class="kicker">먼저 나부터</span><h1>어떻게 불러드릴까요?</h1><p>상대방에게 보일 이름이에요. 전체 이름이 그대로 표시됩니다.</p><form class="form" onsubmit="make(event)"><label>내 이름</label><input name="name" maxlength="20" placeholder="예: 보람" required autofocus><button class="primary full">내 대화틈 만들기</button></form><button class="textbtn" onclick="home()">돌아가기</button></section>`+close()}

function ownInvite(){app.innerHTML=top()+`<section class="card intro center"><span class="kicker">내가 만든 초대 링크예요</span><h1>이 링크는 상대방에게 보내주세요.</h1><p>내 참여 정보는 링크에 들어가지 않아요. 이 기기에서는 기존 대화로 돌아갈게요.</p><button class="primary full" onclick="load()">내 대화로 돌아가기</button><button class="textbtn" onclick="copyInvite()">초대 링크 복사</button></section>`+close()}
function join(){stop();app.innerHTML=top()+`<section class="card intro center"><span class="kicker">대화틈에 초대받았어요</span><h1>당신의 이름만 알려주세요.</h1><p>초대한 사람의 브라우저 상태나 이름은 이 링크로 넘어오지 않아요.</p><form class="form" onsubmit="doJoin(event)"><label>내 이름</label><input name="name" maxlength="20" placeholder="예: 태원" required autofocus><button class="primary full">대화틈에 들어가기</button></form><button class="textbtn" onclick="home(true)">나중에 할게요</button></section>`+close()}
async function doJoin(e){e.preventDefault();if(busy)return;busy=true;let b=e.currentTarget.querySelector('button'),name=new FormData(e.currentTarget).get('name').trim();b.disabled=true;b.textContent='연결하는 중…';try{let d=await rpc('dt_join_room',{p_invite_token:I,p_name:name}),x=Array.isArray(d)?d[0]:d;save({room:x.room_id,token:x.participant_token,name,revealed:[]});I=null;history.replaceState({},'',base());await load()}catch(x){toast(x.message);b.disabled=false;b.textContent='대화틈에 들어가기'}finally{busy=false}}
async function load(silent=false){if(!S)return home();try{let d=await rpc('dt_get_state',{p_room_id:S.room,p_participant_token:S.token}),old=D&&JSON.stringify([D.partner?.name,D.partner?.answered,D.unlocked,D.round_id]),now=JSON.stringify([d.partner?.name,d.partner?.answered,d.unlocked,d.round_id]);D=d;S.name=d.me?.name||S.name;save(S);if(!silent||old!==now)room();poll()}catch(x){if(!silent){app.innerHTML=top()+`<section class="card intro center"><h1>이 대화틈을 불러오지 못했어요.</h1><p>${E(x.message)}</p><button class="primary full" onclick="reset()">처음 화면으로</button></section>`+close()}}}
function room(){let me=D.me||{},p=D.partner,rev=S.revealed.includes(D.round_id),hist=(D.history||[]).filter(x=>x.round_id!==D.round_id||rev),mid=`<div class="people"><span class="avatar">${init(me.name)}</span><span class="who"><b>${E(me.name)}</b><small>나</small></span><span class="x">×</span>${p?`<span class="avatar them">${init(p.name)}</span><span class="who"><b>${E(p.name)}</b><small>함께</small></span>`:'<span class="avatar them">?</span><span class="who"><b>초대 중</b><small>상대방</small></span>'}</div>`;let stage=!p?waitPartner():!me.answered?answer():!p.answered?waitAnswer():D.unlocked&&!rev?reveal():answers();app.innerHTML=top(mid)+`<section class="question"><span class="kicker">ROUND ${String(D.round_sequence||1).padStart(2,'0')}</span><h1>${E(D.question)}</h1><p>${hint()}</p></section>${stage}${hist.length?historyUI(hist):''}<div class="settings"><button class="textbtn" onclick="settings()">설정 · 처음부터 시작</button></div>`+close()}

function waitPartner(){let u=invite();return `<section class="card stage center"><div class="orb"><i></i><i></i></div><span class="kicker">초대할 차례</span><h2>내 대화틈은 준비됐어요.</h2><p>아래 링크만 상대방에게 보내주세요.<br>내 참여 토큰은 링크에 포함되지 않아요.</p><div class="invite"><input readonly value="${E(u)}"><button onclick="copyInvite()">복사</button></div><button class="primary full" onclick="shareInvite()">초대 링크 보내기</button></section>`}

function historyUI(a){return `<section class="history"><div class="historytitle"><h2>지난 대화</h2><span>${a.length}</span></div>${a.map(x=>`<details class="hist"><summary><small>ROUND ${String(x.sequence||'').padStart(2,'0')}</small><b>${E(x.question)}</b><i>⌄</i></summary><div class="histbody"><div><span>${E(D.me.name)} · 나</span><p>${N(x.me_answer)}</p></div><div><span>${E(D.partner?.name||'상대방')}</span><p>${N(x.partner_answer)}</p></div></div></details>`).join('')}</section>`}
async function submitAnswer(e){e.preventDefault();if(busy)return;busy=true;let b=e.currentTarget.querySelector('button'),a=new FormData(e.currentTarget).get('answer').trim();b.disabled=true;b.textContent='보내는 중…';try{D=await rpc('dt_submit_answer',{p_room_id:S.room,p_participant_token:S.token,p_answer:a});room();poll()}catch(x){toast(x.message);b.disabled=false;b.textContent='내 답 보내기'}finally{busy=false}}function openReveal(){if(!S.revealed.includes(D.round_id)){S.revealed.push(D.round_id);save(S)}room()}async function nextRound(){if(busy)return;busy=true;try{D=await rpc('dt_start_next_round',{p_room_id:S.room,p_participant_token:S.token});room();poll()}catch(x){toast(x.message)}finally{busy=false}}
async function copyInvite(){try{await navigator.clipboard.writeText(invite());toast('초대 링크를 복사했어요.')}catch{prompt('초대 링크를 복사해 주세요.',invite())}}async function shareInvite(){if(navigator.share)try{return await navigator.share({title:'대화틈',text:'같은 질문에 각자 답하고, 둘 다 준비되면 함께 열어보자.',url:invite()})}catch(e){if(e.name==='AbortError')return}copyInvite()}function newRoom(){if(confirm('현재 대화틈 대신 새로운 대화틈을 만들까요? 기존 대화는 서버에 남아요.')){save(null);D=null;create()}}function settings(){stop();if(confirm('설정\n\n이 기기에서 현재 대화 연결을 지우고 처음부터 시작할까요?\n서버의 기존 대화는 삭제되지 않습니다.'))reset();else poll()}function reset(){save(null);D=null;I=null;history.replaceState({},'',base());home()}document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S&&D)load(true)});window.addEventListener('popstate',()=>{I=new URLSearchParams(location.search).get('invite');home()});home();
</script></body></html>
