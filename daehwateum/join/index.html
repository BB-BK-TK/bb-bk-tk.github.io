<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f1ea"><title>대화틈 초대</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f1ea;color:#292521;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(92%,480px);background:#fffdfa;border:1px solid #e5ddd3;border-radius:28px;padding:36px 24px;text-align:center;box-shadow:0 20px 60px #4a3b2e10}.mark{width:46px;height:46px;border:1.5px solid #405b52;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;color:#405b52;font-weight:900}.k{font-size:9px;letter-spacing:.14em;font-weight:900;color:#7b746c}h1{font-family:Georgia,"Noto Serif KR",serif;font-weight:500;letter-spacing:-.04em;font-size:32px;line-height:1.25;margin:12px 0}p{color:#7b746c;line-height:1.7;font-size:13px}.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border:0;border-radius:999px;background:#405b52;color:#fff;font-weight:900;text-decoration:none;margin-top:18px}.btn.alt{background:transparent;color:#292521;border:1px solid #e5ddd3;margin-top:10px}.note{font-size:10px;margin-top:15px}</style></head><body><main class="card"><div class="mark">••</div><span class="k">7 DAYS · INVITATION</span><h1>대화틈에 초대받았어요.</h1><p>앱에서 열면 이 초대가 바로 연결돼요.<br>아직 설치하지 않았다면 먼저 앱을 설치해 주세요.</p><button class="btn" id="open">대화틈 앱에서 열기</button><a class="btn alt" href="../downloads/daehwateum-beta.apk">앱 설치하기</a><p class="note">Android private beta · 설치 중 ‘알 수 없는 앱’ 허용이 필요할 수 있어요.</p></main><script>const p=new URLSearchParams(location.search),t=p.get('invite')||'';document.getElementById('open').onclick=()=>{if(!t){alert('초대 정보가 없어요.');return}location.href='daehwateum://join?invite='+encodeURIComponent(t)};</script></body></html>
