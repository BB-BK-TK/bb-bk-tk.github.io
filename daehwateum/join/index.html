<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f1ea"><title>대화틈 초대</title><style>*{box-sizing:border-box}html{word-break:keep-all}body{margin:0;background:#f6f1ea;color:#292521;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(92%,480px);background:#fffdfa;border:1px solid #e5ddd3;border-radius:28px;padding:36px 24px;text-align:center;box-shadow:0 20px 60px #4a3b2e10}.mark{width:46px;height:46px;border:1.5px solid #405b52;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;color:#405b52;font-weight:900}.k{font-size:9px;letter-spacing:.14em;font-weight:900;color:#7b746c}h1{font-weight:850;letter-spacing:-.04em;font-size:32px;line-height:1.25;margin:12px 0;text-wrap:balance}p{color:#7b746c;line-height:1.7;font-size:13px}.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border:0;border-radius:999px;background:#405b52;color:#fff;font-weight:900;text-decoration:none;margin-top:18px}.btn.alt{background:transparent;color:#292521;border:1px solid #e5ddd3;margin-top:10px}.btn[disabled]{opacity:.45}.note{font-size:10px;margin-top:15px}</style></head><body><main class="card"><div class="mark">••</div><span class="k">7 DAYS · INVITATION</span><h1 id="title">대화틈에 초대받았어요.</h1><p id="body">초대 상태를 확인하고 있어요.</p><button class="btn" id="open" disabled>대화틈 앱에서 열기</button><a class="btn alt" id="install" href="../downloads/daehwateum-beta.apk">앱 설치하기</a><p class="note" id="note">Android private beta</p></main><script>(function(){const p=new URLSearchParams(location.search),t=p.get('invite')||'',ko=(navigator.language||'ko').toLowerCase().startsWith('ko'),title=document.getElementById('title'),body=document.getElementById('body'),open=document.getElementById('open'),install=document.getElementById('install'),note=document.getElementById('note');function closed(h,b){title.textContent=h;body.textContent=b;open.style.display='none';install.style.display='none';note.textContent=''}if(!t){closed(ko?'초대 정보가 없어요.':'Invite not found.',ko?'링크를 다시 확인해 주세요.':'Please check the link.');return}fetch('https://kacvynoegfpvgdpqtjdi.supabase.co/rest/v1/rpc/dt_get_invite_status',{method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_SeG92zfrAeh5zECaVbztkw_qb0C91D6'},body:JSON.stringify({p_invite_token:t})}).then(r=>r.json()).then(s=>{if(!s||!s.valid){closed(ko?'이 초대는 더 이상 열 수 없어요.':'This invite is no longer available.',ko?'링크가 만료되었거나 유효하지 않아요.':'The link has expired or is invalid.');return}if(s.full){closed(ko?'이 대화틈은 다 찼어요.':'This space is full.',ko?'최대 '+s.max_participants+'명까지 함께할 수 있어요. 새로 참여할 수는 없어요.':'Up to '+s.max_participants+' people can join this space. No more spots are available.');return}title.textContent=ko?'대화틈에 초대받았어요.':'You were invited to Daehwateum.';body.textContent=ko?'앱에서 열면 이 초대가 바로 연결돼요.':'Open the app to join this conversation space.';open.textContent=ko?'대화틈 앱에서 열기':'Open in Daehwateum';install.textContent=ko?'앱 설치하기':'Install app';open.disabled=false;open.onclick=()=>{location.href='daehwateum://join?invite='+encodeURIComponent(t)}}).catch(()=>{body.textContent=ko?'초대 상태를 확인하지 못했어요. 잠시 후 다시 시도해 주세요.':'Could not check this invite. Please try again.'})})();</script></body></html>
