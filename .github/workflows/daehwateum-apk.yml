name: Build Daehwateum APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/daehwateum-apk.yml'

permissions:
  contents: write

concurrency:
  group: daehwateum-apk-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daehwateum-beta-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Pages
        run: |
          mkdir -p daehwateum/downloads
          cp android-app/app/build/outputs/apk/debug/app-debug.apk daehwateum/downloads/daehwateum-beta.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add daehwateum/downloads/daehwateum-beta.apk
          if git diff --cached --quiet; then
            echo 'APK unchanged'
          else
            git commit -m 'Publish Daehwateum beta APK [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
