name: Android APK

run-name: Android APK #${{ github.run_number }}

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp android-app/app/build/outputs/apk/debug/app-debug.apk dist/daehwateum-beta.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daehwateum-beta-apk
          path: dist/daehwateum-beta.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: daehwateum-beta-${{ github.run_number }}
          name: 대화틈 Beta #${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          files: dist/daehwateum-beta.apk
          body: |
            대화틈 Android private beta build.

            - Branch: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`
            - Workflow run: #${{ github.run_number }}
