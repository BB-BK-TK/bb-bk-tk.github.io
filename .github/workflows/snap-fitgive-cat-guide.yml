name: Snap FitGive cat guide frames

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/snap-fitgive-cat-guide.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace interpolated cat video with beat-driven keyframe poses
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('fitgive/index.html')
          s=p.read_text()
          pattern=r'const GUIDE_VIDEO=\{cycle:50/24, deep:28/24\};.*?return \{start:start,play:play,pause:pause,resync:resync,poseAt:poseAt\};\s*\}\)\(\);'
          replacement='''const GUIDE_VIDEO={cycle:50/24,key:[0,12/24,25/24]};
    const VideoGuide=(function(){
      let lastFrame=-1;
      function el(){return document.getElementById('guideVideo')}
      function frameFor(phase){
        if(phase<0.14||phase>=0.86)return 0;
        if(phase<0.40||phase>=0.60)return 1;
        return 2;
      }
      function show(phase){
        const v=el();if(!v)return;
        const idx=frameFor(phase);if(idx===lastFrame)return;
        lastFrame=idx;v.pause();
        const apply=function(){try{v.currentTime=GUIDE_VIDEO.key[idx]}catch(e){}};
        if(v.readyState>=1)apply();
        else v.addEventListener('loadedmetadata',apply,{once:true});
      }
      function start(){lastFrame=-1;show(0)}
      function play(){}
      function pause(){const v=el();if(v)v.pause()}
      function resync(phase){show(phase)}
      function poseAt(phase){show(phase)}
      return {start:start,play:play,pause:pause,resync:resync,poseAt:poseAt};
    })();'''
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1:
            raise SystemExit(f'VideoGuide block replacement count={n}')
          s2=s2.replace('muted playsinline loop preload="auto"','muted playsinline preload="auto"')
          p.write_text(s2)
          PY

      - name: Commit keyframe guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fitgive/index.html
          git commit -m "Use beat-driven cat keyframes without ghosting"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
