name: Mirror FitGive workout guide sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-fitgive-workout-guide-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror canonical FitGive guide timing fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('fitgive/index.html')
          s = p.read_text()
          video_old = "const GUIDE_VIDEO={cycle:50/24,key:[0,12/24,25/24]};"
          video_new = "const GUIDE_VIDEO={cycle:50/24,key:[0,12/24,25/24]};\n    const GUIDE_PHASE={bottom:0.40,standingAgain:0.86};"
          if 'const GUIDE_PHASE=' not in s:
              if video_old not in s: raise SystemExit('GUIDE_VIDEO marker not found')
              s = s.replace(video_old, video_new, 1)
          tick_old = "const progress=elapsed/g.repSec;\n      const repIndex=Math.floor(progress);\n      const phase=progress-repIndex;\n\n      paintGuide(phase);"
          tick_new = "const progress=elapsed/g.repSec;\n      const cycleIndex=Math.floor(progress);\n      const phase=progress-cycleIndex;\n      // Count a rep as soon as the guide is fully standing again, not at the next cycle boundary.\n      const repIndex=Math.floor(progress+(1-GUIDE_PHASE.standingAgain));\n\n      paintGuide(phase);"
          if tick_old in s: s = s.replace(tick_old, tick_new, 1)
          elif tick_new not in s: raise SystemExit('beat tick marker not found')
          guide_old = "function paintGuide(phase){\n      const down=phase<0.5;\n      VideoGuide.poseAt(phase);"
          guide_new = "function paintGuide(phase){\n      // Bottom pose cues standing up; fully upright cues the next squat down.\n      const down=phase<GUIDE_PHASE.bottom||phase>=GUIDE_PHASE.standingAgain;\n      VideoGuide.poseAt(phase);"
          if guide_old in s: s = s.replace(guide_old, guide_new, 1)
          elif guide_new not in s: raise SystemExit('paintGuide marker not found')
          required = ['const GUIDE_PHASE={bottom:0.40,standingAgain:0.86};','const cycleIndex=Math.floor(progress);','const repIndex=Math.floor(progress+(1-GUIDE_PHASE.standingAgain));','const down=phase<GUIDE_PHASE.bottom||phase>=GUIDE_PHASE.standingAgain;']
          missing = [x for x in required if x not in s]
          if missing: raise SystemExit('missing expected mirror markers: ' + repr(missing))
          p.write_text(s)
          PY

      - name: Commit deployment mirror and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fitgive/index.html
          git rm .github/workflows/fix-fitgive-workout-guide-sync.yml
          git commit -m "Mirror FitGive squat guide sync"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
